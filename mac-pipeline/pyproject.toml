[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sunhacks-pipeline"
version = "0.1.0"
description = "Timestamped local Mac multimodal research pipeline"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "pillow>=11,<14", "httpx>=0.28,<1", "psutil>=7,<8"]

[project.optional-dependencies]
capture = ["opencv-contrib-python>=4.11,<6", "sounddevice>=0.5,<1"]
models = ["torch>=2.6,<3", "torchvision>=0.21,<1", "torchaudio>=2.6,<3", "transformers>=4.51,<6", "safetensors>=0.5,<1", "huggingface-hub>=0.30,<2", "sentencepiece>=0.2,<1", "einops>=0.8,<1", "timm>=1,<2"]
adapters = ["peft>=0.15,<1"]
emotion = ["funasr>=1.2,<2"]
tabular = ["xgboost>=3,<4"]
faces = ["mediapipe>=0.10.35,<0.11"]
rppg = ["onnxruntime>=1.20,<2"]
asr = ["faster-whisper>=1.1,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
sunhacks = "sunhacks.__main__:main"

[tool.setuptools.packages.find]
include = ["sunhacks*"]

[tool.setuptools.package-data]
sunhacks = ["static/*.html", "models_manifest.json", "vendor/*.json", "rppg_weights/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
